<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USABOguide • USABO Finalist & IBO Training</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%2310b981'/></linearGradient></defs><rect width='40' height='40' rx='11' fill='url(%23g)'/><g fill='none' stroke='white' stroke-linecap='round' stroke-width='2.4'><path d='M14 9c12 3.6 12 7.4 0 11'/><path d='M26 9c-12 3.6-12 7.4 0 11' opacity='.6'/><path d='M14 20c12 3.6 12 7.4 0 11'/><path d='M26 20c-12 3.6-12 7.4 0 11' opacity='.6'/><path d='M15.6 13.4h8.8M15.6 26.6h8.8' stroke-width='1.6' opacity='.85'/></g></svg>">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- KaTeX for Beautiful Mathematical Equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- PWA Manifest for Standalone / Offline App Installation -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* ===== INTERACTIVE LESSON ANIMATIONS ===== */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.4); }
      50%      { box-shadow: 0 0 20px 4px rgba(99,102,241,0.15); }
    }
    @keyframes flipIn {
      0%   { transform: rotateY(90deg); opacity: 0; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }
    @keyframes flipOut {
      0%   { transform: rotateY(0deg); opacity: 1; }
      100% { transform: rotateY(-90deg); opacity: 0; }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes correctPop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    @keyframes xpFloat {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
    }
    @keyframes progressFill {
      from { width: 0%; }
    }
    @keyframes typeReveal {
      from { max-height: 0; opacity: 0; }
      to   { max-height: 2000px; opacity: 1; }
    }
    @keyframes tabSwitch {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-fade-up    { animation: fadeSlideUp 0.5s ease-out both; }
    .anim-fade-in    { animation: fadeSlideIn 0.4s ease-out both; }
    .anim-scale-in   { animation: scaleIn 0.4s ease-out both; }
    .anim-pulse-glow { animation: pulseGlow 2.5s ease-in-out infinite; }
    .anim-float      { animation: float 3s ease-in-out infinite; }
    .anim-correct    { animation: correctPop 0.4s ease-out; }
    .anim-wrong      { animation: wrongShake 0.5s ease-out; }
    .anim-xp-float   { animation: xpFloat 1.2s ease-out forwards; }
    .anim-tab-switch { animation: tabSwitch 0.3s ease-out both; }
    .anim-progress   { animation: progressFill 0.8s ease-out both; }
    .anim-type-reveal { animation: typeReveal 0.6s ease-out both; overflow: hidden; }

    /* Flashcard 3D flip */
    .flashcard-container { perspective: 1000px; }
    .flashcard-inner {
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      position: relative;
    }
    .flashcard-inner.flipped { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flashcard-back { transform: rotateY(180deg); position: absolute; inset: 0; }

    /* Shimmer loading effect */
    .shimmer-bg {
      background: linear-gradient(90deg, transparent 0%, rgba(99,102,241,0.08) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 2s linear infinite;
    }

    /* Tab pill active indicator */
    .lesson-tab-active {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(99,102,241,0.3);
    }

    /* Smooth content reveals */
    .content-reveal { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

    /* Interactive option hover glow */
    .option-hover-glow:hover {
      box-shadow: 0 0 0 1px rgba(99,102,241,0.3), 0 4px 12px rgba(99,102,241,0.1);
    }

    /* Rank badge shimmer */
    .rank-badge {
      background: linear-gradient(135deg, rgba(245,158,11,0.15) 0%, rgba(99,102,241,0.15) 100%);
      border: 1px solid rgba(245,158,11,0.3);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Top Sticky Navigation Bar -->
  <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      
      <!-- Brand & Olympiad Badge -->
      <div class="flex items-center gap-3">
        <a href="#" id="brand-link" data-nav="track" class="flex items-center gap-2.5 shrink-0">
          <svg viewBox="0 0 40 40" class="w-9 h-9 rounded-xl shrink-0 shadow-lg shadow-indigo-600/30" aria-label="USABOguide logo" role="img">
            <defs>
              <linearGradient id="usabo-mark" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#6366f1"/>
                <stop offset="55%" stop-color="#4338ca"/>
                <stop offset="100%" stop-color="#10b981"/>
              </linearGradient>
            </defs>
            <rect width="40" height="40" rx="11" fill="url(#usabo-mark)"/>
            <g fill="none" stroke="#ffffff" stroke-linecap="round">
              <path d="M14 9c12 3.6 12 7.4 0 11" stroke-width="2.2"/>
              <path d="M26 9c-12 3.6-12 7.4 0 11" stroke-width="2.2" opacity=".6"/>
              <path d="M14 20c12 3.6 12 7.4 0 11" stroke-width="2.2"/>
              <path d="M26 20c-12 3.6-12 7.4 0 11" stroke-width="2.2" opacity=".6"/>
              <path d="M15.6 13.4h8.8M15.6 26.6h8.8" stroke-width="1.5" opacity=".85"/>
            </g>
          </svg>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-black text-white text-base tracking-tight">USABO<span class="text-emerald-300">guide</span></span>
            </div>
            <span class="block text-[10px] text-slate-400 font-medium">USABO · IBO exam prep</span>
          </div>
        </a>
      </div>

      <!-- Navigation Tabs -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-900/80 p-1 rounded-2xl border border-slate-800">
        <button data-nav="track" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition flex items-center gap-2">
          <span>🗺</span> Mastery Track
        </button>
        <button data-nav="flashcards" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition flex items-center gap-2">
          <span>🗂</span> Active Recall
        </button>
        <button data-nav="whatif" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition flex items-center gap-2">
          <span>⚡</span> What-If Lab
        </button>
        <button data-nav="quiz" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition flex items-center gap-2">
          <span>🎯</span> Finalist Quizzes
        </button>
        <button data-nav="equations" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition flex items-center gap-2">
          <span>📐</span> Equation Bank
        </button>
        <button data-nav="textbooks" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition flex items-center gap-2">
          <span>📚</span> Sourced Textbooks
        </button>
      </nav>

      <!-- User Progress & Metrics -->
      <div class="flex items-center gap-3">
        <!-- Rank Badge -->
        <div id="rank-badge-container" class="hidden sm:flex items-center gap-1.5 rank-badge px-3 py-1.5 rounded-xl text-xs font-bold">
          <span id="rank-badge-emoji">🥉</span>
          <span id="rank-badge-title" class="text-amber-300 hidden lg:inline">Semifinalist</span>
        </div>

        <!-- Streak -->
        <div class="hidden sm:flex items-center gap-1.5 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold text-amber-400">
          <span>🔥</span>
          <span id="user-streak">5 Day Streak</span>
        </div>

        <!-- Bio XP -->
        <div class="flex items-center gap-1.5 bg-indigo-950/60 border border-indigo-800/60 px-3 py-1.5 rounded-xl text-xs font-bold text-indigo-300">
          <span>⚡</span>
          <span id="user-xp">450 XP</span>
        </div>

        <!-- Finalist Readiness Meter -->
        <div class="hidden lg:flex items-center gap-2 bg-emerald-950/40 border border-emerald-800/50 px-3 py-1.5 rounded-xl text-xs font-semibold text-emerald-300 whitespace-nowrap">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="user-readiness">0% Finalist Ready</span>
        </div>
      </div>

    </div>
  </header>

  <!-- Mobile Navigation Bar -->
  <div class="md:hidden flex items-center justify-around bg-slate-950 border-b border-slate-800 px-2 py-2 text-xs overflow-x-auto gap-1">
    <button data-nav="track" class="text-slate-300 hover:text-white px-2 py-1 whitespace-nowrap">🗺 Track</button>
    <button data-nav="flashcards" class="text-slate-300 hover:text-white px-2 py-1 whitespace-nowrap">🗂 Recall</button>
    <button data-nav="whatif" class="text-slate-300 hover:text-white px-2 py-1 whitespace-nowrap">⚡ Lab</button>
    <button data-nav="quiz" class="text-slate-300 hover:text-white px-2 py-1 whitespace-nowrap">🎯 Quizzes</button>
    <button data-nav="equations" class="text-slate-300 hover:text-white px-2 py-1 whitespace-nowrap">📐 Equations</button>
    <button data-nav="textbooks" class="text-slate-300 hover:text-white px-2 py-1 whitespace-nowrap">📚 Textbooks</button>
  </div>

  <!-- Main View Container -->
  <main id="app-main" class="flex-1 px-4 lg:px-8 py-8">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Footer -->
  <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <span>USABOguide • USABO Finalist & IBO exam prep</span>
      <div class="flex items-center gap-4 text-[11px] text-slate-400">
        <span>Alberts (MBoC)</span>
        <span>•</span>
        <span>Vander's Physiology</span>
        <span>•</span>
        <span>Raven's Plants</span>
        <span>•</span>
        <span>Pierce Genetics</span>
      </div>
    </div>
  </footer>

  <!-- App Bootstrap -->
  <script type="module">
    // Automatic Cache-Buster & PWA Cache Clear
    if ('caches' in window) {
      caches.keys().then(keys => {
        keys.forEach(key => {
          if (key !== 'bioapex-cache-v10') caches.delete(key);
        });
      });
    }

    import { initApp } from './src/app.js';

    function startApp() {
      initApp();

      // Register PWA Service Worker with auto-update
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.update();
        }).catch(err => console.log('SW registration note:', err));
      }

    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
</body>
</html>
